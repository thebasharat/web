<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suresh's Kids' Sketch Pad</title>
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  rel="stylesheet"
>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f5f7;
    text-align: center;
    padding-top: 16px;
  }
  h2 {
    margin-bottom: 14px;
    font-size: 20px;
  }
  #sketchPad {
    border: 1px solid #333;
    background: #ffffff;
    cursor: crosshair;
    touch-action: none;
  }
  .btn-row {
    margin-top: 12px;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn-row button {
    min-width: 70px;
  }
  #currentColorWrapper {
    margin-top: 10px;
    font-size: 13px;
  }
</style>
</head>
<body>

<h2>Suresh's Kids' Sketch Pad</h2>

<canvas id="sketchPad" width="500" height="300"></canvas>

<div class="btn-row">
  <button type="button" id="defaultBtn" class="btn btn-dark btn-sm">Default</button>
  <button type="button" id="redBtn" class="btn btn-danger btn-sm">Red</button>
  <button type="button" id="blueBtn" class="btn btn-primary btn-sm">Blue</button>
  <button type="button" id="greenBtn" class="btn btn-success btn-sm">Green</button>
  <button type="button" id="eraserBtn" class="btn btn-secondary btn-sm">Eraser</button>
  <button type="button" id="clearBtn" class="btn btn-warning btn-sm">Clear Canvas</button>
</div>

<div id="currentColorWrapper">
  Current Drawing Color: <strong id="currentColor">Black</strong>
</div>

<script src="script.js"></script>
</body>
</html>
