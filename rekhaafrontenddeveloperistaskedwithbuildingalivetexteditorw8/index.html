<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Live Textarea Editor</title>
        <!-- Bootstrap 5 CSS -->
          <link
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
                  rel="stylesheet"
                    >
                      <style>
                          /* Default textarea styles */
                              #editor {
                                    font-size: 12px;
                                          color: black;
                                                font-weight: normal;
                                                      font-style: normal;
                                                            min-height: 200px;
                                                                }
                                                                  </style>
                                                                  </head>
                                                                  <body>

                                                                    <div class="container my-5" style="max-width: 950px;">
                                                                        <h2 class="text-center mb-4">Live Textarea Editor</h2>

                                                                            <!-- Controls Row -->
                                                                                <div class="row align-items-end g-3 mb-3">
                                                                                      <!-- Font Size Dropdown -->
                                                                                            <div class="col-md-4">
                                                                                                    <label for="fontSizeSelect" class="form-label mb-1">Font Size</label>
                                                                                                            <select id="fontSizeSelect" class="form-select">
                                                                                                                      <option value="12px" selected>12px</option>
                                                                                                                                <option value="16px">16px</option>
                                                                                                                                          <option value="20px">20px</option>
                                                                                                                                                  </select>
                                                                                                                                                        </div>

                                                                                                                                                              <!-- Font Color Dropdown -->
                                                                                                                                                                    <div class="col-md-4">
                                                                                                                                                                            <label for="fontColorSelect" class="form-label mb-1">Font Color</label>
                                                                                                                                                                                    <select id="fontColorSelect" class="form-select">
                                                                                                                                                                                              <option value="black" selected>Black</option>
                                                                                                                                                                                                        <option value="blue">Blue</option>
                                                                                                                                                                                                                  <option value="red">Red</option>
                                                                                                                                                                                                                          </select>
                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                      <!-- Font Style Buttons -->
                                                                                                                                                                                                                                            <div class="col-md-4">
                                                                                                                                                                                                                                                    <div class="btn-group w-100" role="group">
                                                                                                                                                                                                                                                              <button type="button" id="boldBtn" class="btn btn-outline-dark">Bold</button>
                                                                                                                                                                                                                                                                        <button type="button" id="italicBtn" class="btn btn-outline-dark">Italic</button>
                                                                                                                                                                                                                                                                                  <button type="button" id="resetBtn" class="btn btn-outline-secondary">Reset</button>
                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                        <!-- Textarea Editor -->
                                                                                                                                                                                                                                                                                                            <div>
                                                                                                                                                                                                                                                                                                                  <textarea
                                                                                                                                                                                                                                                                                                                          id="editor"
                                                                                                                                                                                                                                                                                                                                  class="form-control"
                                                                                                                                                                                                                                                                                                                                          placeholder="Type something here..."
                                                                                                                                                                                                                                                                                                                                                ></textarea>
                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                        <!-- JavaScript Interaction Logic -->
                                                                                                                                                                                                                                                                                                                                                          <script>
                                                                                                                                                                                                                                                                                                                                                              document.addEventListener("DOMContentLoaded", () => {
                                                                                                                                                                                                                                                                                                                                                                    // Element variables as referenced by tests
                                                                                                                                                                                                                                                                                                                                                                          const editor = document.getElementById("editor");
                                                                                                                                                                                                                                                                                                                                                                                const fontSizeSelect = document.getElementById("fontSizeSelect");
                                                                                                                                                                                                                                                                                                                                                                                      const fontColorSelect = document.getElementById("fontColorSelect");
                                                                                                                                                                                                                                                                                                                                                                                            const boldBtn = document.getElementById("boldBtn");
                                                                                                                                                                                                                                                                                                                                                                                                  const italicBtn = document.getElementById("italicBtn");
                                                                                                                                                                                                                                                                                                                                                                                                        const resetBtn = document.getElementById("resetBtn");

                                                                                                                                                                                                                                                                                                                                                                                                              // Initial defaults
                                                                                                                                                                                                                                                                                                                                                                                                                    editor.style.fontSize = "12px";
                                                                                                                                                                                                                                                                                                                                                                                                                          editor.style.color = "black";
                                                                                                                                                                                                                                                                                                                                                                                                                                editor.style.fontWeight = "normal";
                                                                                                                                                                                                                                                                                                                                                                                                                                      editor.style.fontStyle = "normal";

                                                                                                                                                                                                                                                                                                                                                                                                                                            // Font Size Change Event
                                                                                                                                                                                                                                                                                                                                                                                                                                                  fontSizeSelect.addEventListener("change", (e) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                          editor.style.fontSize = e.target.value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // Font Color Change Event
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            fontColorSelect.addEventListener("change", (e) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    editor.style.color = e.target.value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Bold Toggle Event
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      boldBtn.addEventListener("click", () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              boldBtn.classList.toggle("active");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (boldBtn.classList.contains("active")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                editor.style.fontWeight = "bold";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  editor.style.fontWeight = "normal";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // Italic Toggle Event
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            italicBtn.addEventListener("click", () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    italicBtn.classList.toggle("active");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (italicBtn.classList.contains("active")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      editor.style.fontStyle = "italic";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        editor.style.fontStyle = "normal";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Reset Button Event
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  resetBtn.addEventListener("click", () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          // Reset styles on textarea
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  editor.style.fontSize = "12px";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          editor.style.color = "black";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  editor.style.fontWeight = "normal";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          editor.style.fontStyle = "normal";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // Reset control values & classes
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          fontSizeSelect.value = "12px";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  fontColorSelect.value = "black";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          boldBtn.classList.remove("active");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  italicBtn.classList.remove("active");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </html>
